<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2310131f'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%236ee7dc' font-family='monospace' font-weight='bold'%3Ein%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>3D Flight View</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
      }
      .loading-title {
        font-size: 1.5rem;
        font-weight: bold;
        margin: 0 0 1rem;
      }
      .spinner {
        width: 30px;
        height: 30px;
        border: 3px solid transparent;
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #hud {
        position: fixed;
        top: 0.75rem;
        left: 0.75rem;
        z-index: 40;
        color: #fff;
        font-family: monospace;
        font-size: 0.85rem;
        line-height: 1.45;
        text-align: center;
        background: rgba(10, 25, 15, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        padding: 0.6rem 1rem;
      }
      #hud hr {
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.35);
        margin: 0.4rem 0;
      }
      #root {
        display: contents;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="hud">
      <div>Players: 0</div>
      <div>Health: 0%</div>
      <div id="speed">Speed: 0.0 km/h</div>
      <div id="altitude">Altitude: 0.0 m</div>
      <hr />
      <div>Controls:</div>
      <div>W/S: Speed</div>
      <div>A/D: Yaw</div>
      <div>Arrows: Pitch/Roll</div>
      <hr />
      <div>R: Reset</div>
    </div>
    <div id="loading">
      <h2 class="loading-title">Loading</h2>
      <div class="spinner"></div>
    </div>
    <script>
      window.addEventListener('message', (e) => {
        if (e.data?.type === 'GAME_SIZE') {
          const c = document.querySelector('canvas');
          if (c && e.data.width && e.data.height) {
            c.style.width = `${e.data.width}px`;
            c.style.height = `${e.data.height}px`;
          }
        }
      });
    </script>
    <script>
      (function () {
        function reportGameSize() {
          const height = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
          const width = Math.max(document.body.scrollWidth, document.documentElement.scrollWidth);
          window.parent.postMessage({ type: 'GAME_SIZE_RESPONSE', height: height, width: width }, '*');
        }
        window.addEventListener('load', reportGameSize);
        window.addEventListener('resize', reportGameSize);
        window.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'REQUEST_GAME_SIZE') {
            reportGameSize();
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
