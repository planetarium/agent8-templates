<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%236b7f5e%22/><rect x=%2235%22 y=%2235%22 width=%2230%22 height=%2230%22 fill=%22%23ffd166%22/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Stage — Incanto 3D empty stage</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #9bc4e2;
      }
      #root {
        display: contents;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .loading-container {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: black;
        color: white;
      }
      .loading-title {
        font-size: 1.5rem;
        font-weight: bold;
        margin-bottom: 1rem;
      }
      .spinner {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="loading-container" id="loading">
      <h2 class="loading-title">Loading</h2>
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script>
      // agent8 embed harness: report the game size to a hosting iframe parent.
      function postGameSize() {
        window.parent.postMessage(
          { type: 'GAME_SIZE_RESPONSE', width: document.body.scrollWidth, height: document.body.scrollHeight },
          '*',
        );
      }
      window.addEventListener('load', postGameSize);
      window.addEventListener('resize', postGameSize);
      window.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'REQUEST_GAME_SIZE') postGameSize();
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
