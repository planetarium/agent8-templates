<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%233b6ea5%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-weight=%22bold%22 fill=%22%236ee7dc%22>vg</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vanguard — Incanto TPS</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #0b0d14;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .loading-container {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: black;
        color: white;
      }
      .loading-title {
        font-size: 1.5rem;
        font-weight: bold;
        margin-bottom: 1rem;
      }
      /* Crosshair (the camera aim point — where the hitscan goes) */
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 26px;
        height: 26px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 50;
      }
      .ch-h,
      .ch-v {
        position: absolute;
        left: 50%;
        top: 50%;
        background: #eafffb;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.85);
      }
      .ch-h {
        width: 16px;
        height: 2px;
        transform: translate(-50%, -50%);
      }
      .ch-v {
        width: 2px;
        height: 16px;
        transform: translate(-50%, -50%);
      }
      .ch-dot {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #6ee7dc;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.85);
      }
      /* On-screen buttons (mobile + desktop parity) */
      .action-buttons {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        z-index: 1001;
      }
      .round-btn {
        border: none;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.25);
        color: white;
        font-weight: bold;
        font-size: 0.75rem;
        cursor: pointer;
        transition: transform 0.1s;
        user-select: none;
        -webkit-user-select: none;
      }
      .round-btn:active {
        transform: scale(0.9);
      }
      .round-btn.fire {
        width: 84px;
        height: 84px;
        background: rgba(59, 110, 165, 0.5);
      }
      .round-btn.jump {
        position: absolute;
        left: -3.25rem;
        top: -3.25rem;
        width: 56px;
        height: 56px;
      }
      /* This game's HUD is plain DOM. `HudLayer` + `UiText`/`UiBar` work in 3D
         too (see incanto-hud.md) and are readable headlessly — the scene has one
         for the banner. Either is fine; DOM here is a choice, not a limit. */
      #hud {
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 40;
        pointer-events: none;
        color: #f4f4f4;
        font-weight: bold;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        line-height: 1.5;
      }
      #hud-wave {
        color: #ffd166;
        font-size: 22px;
      }
      #hud-hp {
        color: #6ee7dc;
        font-size: 20px;
      }
      #hud-hp-track {
        width: 180px;
        height: 7px;
        margin: 3px 0 6px;
        background: rgba(255, 255, 255, 0.18);
        border-radius: 9999px;
        overflow: hidden;
      }
      #hud-hp-fill {
        width: 100%;
        height: 100%;
        background: #6ee7dc;
        transition: width 0.12s linear;
      }
      #hud-kills {
        font-size: 20px;
      }
      #hud-ammo {
        color: #8fc7ff;
        font-size: 20px;
      }
      #hint {
        position: fixed;
        bottom: 14px;
        left: 14px;
        z-index: 40;
        pointer-events: none;
        color: rgba(255, 255, 255, 0.7);
        font-size: 13px;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      }
      #banner {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        font-size: 52px;
        font-weight: bold;
        color: #fff;
        opacity: 0;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
        transition: opacity 0.25s;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .progress-track {
        width: 256px;
        height: 8px;
        background: #374151;
        border-radius: 9999px;
        overflow: hidden;
      }
      .progress-fill {
        width: 0%;
        height: 100%;
        background: #3b6ea5;
        transition: width 0.3s;
      }
      .progress-text {
        margin-top: 0.5rem;
        font-size: 0.9rem;
      }
      #root {
        display: contents;
      }
    </style>
  </head>
  <body>
    <div class="loading-container" id="loading">
      <h2 class="loading-title">Vanguard</h2>
      <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
      <div class="progress-text" id="progress-text">0%</div>
    </div>
    <div id="root"></div>
    <div id="hud">
      <div id="hud-wave">Wave 1 / 3</div>
      <div id="hud-hp">HP 100</div>
      <div id="hud-hp-track"><div id="hud-hp-fill"></div></div>
      <div id="hud-kills">Kills 0</div>
      <div id="hud-ammo">Ammo 18 / 18</div>
    </div>
    <div id="hint">WASD move · mouse look (click to lock) · Shift sprint · Space jump · click / F fire · R reload</div>
    <div id="banner"></div>
    <div id="crosshair">
      <div class="ch-h"></div>
      <div class="ch-v"></div>
      <div class="ch-dot"></div>
    </div>
    <div class="action-buttons">
      <button type="button" id="btn-fire" class="round-btn fire">FIRE</button>
      <button type="button" id="btn-jump" class="round-btn jump">JUMP</button>
    </div>
    <script>
      // agent8 embed harness: report the game size to a hosting iframe parent.
      function postGameSize() {
        window.parent.postMessage(
          { type: 'GAME_SIZE_RESPONSE', width: document.body.scrollWidth, height: document.body.scrollHeight },
          '*',
        );
      }
      window.addEventListener('load', postGameSize);
      window.addEventListener('resize', postGameSize);
      window.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'REQUEST_GAME_SIZE') postGameSize();
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
