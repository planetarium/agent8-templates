<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232a4a6b%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-weight=%22bold%22 fill=%22%23ffd166%22>bi</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Beacon Isle — Incanto 3D template</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #10130d;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .loading-container {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: black;
        color: white;
      }
      .loading-title {
        font-size: 1.5rem;
        font-weight: bold;
        margin-bottom: 1rem;
      }
      .progress-track {
        width: 240px;
        height: 8px;
        border-radius: 4px;
        background: #2a2f26;
        overflow: hidden;
      }
      #progress {
        width: 0%;
        height: 100%;
        background: #ffd166;
        transition: width 0.15s;
      }
      #progress-text {
        margin-top: 8px;
        font-size: 0.85rem;
        color: #aaa;
      }
      #root {
        display: contents;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="loading" class="loading-container">
      <div class="loading-title">Beacon Isle</div>
      <div class="progress-track"><div id="progress"></div></div>
      <div id="progress-text">0%</div>
    </div>
    <script>
      (function () {
        function reportGameSize() {
          const height = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
          const width = Math.max(document.body.scrollWidth, document.documentElement.scrollWidth);
          window.parent.postMessage({ type: 'GAME_SIZE_RESPONSE', height: height, width: width }, '*');
        }
        window.addEventListener('load', reportGameSize);
        window.addEventListener('resize', reportGameSize);
        window.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'REQUEST_GAME_SIZE') {
            reportGameSize();
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
